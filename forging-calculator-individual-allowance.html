<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锻件算重报价系统 - 独立余量版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .shape-list {
            margin-bottom: 20px;
        }

        .shape-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .shape-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .shape-title {
            font-weight: bold;
            color: #667eea;
        }

        .btn-remove {
            padding: 5px 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-remove:hover {
            background: #ff3838;
        }

        /* 精尺寸和余量在同一行 */
        .dimension-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .dimension-group {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .dimension-group-title {
            font-size: 13px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .input-pair {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-pair label {
            flex: 0 0 40px;
            font-size: 12px;
            color: #666;
        }

        .input-pair input {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-pair input:focus {
            outline: none;
            border-color: #667eea;
        }

        .allowance-hint {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group-inline {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group-inline .form-group {
            flex: 1;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .results-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .result-section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .result-item:last-child {
            border-bottom: none;
            font-weight: bold;
        }

        .result-label {
            opacity: 0.9;
        }

        .result-value {
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .info-text {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }

            .dimension-row {
                grid-template-columns: 1fr;
            }

            .form-group-inline {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ 锻件算重报价系统 - 独立余量版</h1>
            <p>每段形状可设置不同余量 | 精尺寸与余量同行显示 | 单位：毫米(mm)</p>
        </div>

        <div class="content">
            <div class="info-text">
                💡 <strong>使用说明：</strong>每行输入精尺寸（加工后）和对应余量（每面留量），系统自动计算毛坯尺寸和重量
            </div>

            <!-- 圆柱形部分 -->
            <div class="section">
                <div class="section-title">
                    <span>📊 圆柱形段 (每段可设置不同余量)</span>
                    <button class="btn-add" onclick="addCylinder()">+ 添加圆柱</button>
                </div>
                <div id="cylinder-list" class="shape-list">
                    <!-- 动态添加圆柱形输入 -->
                </div>
            </div>

            <!-- 方形部分 -->
            <div class="section">
                <div class="section-title">
                    <span>📐 方形段 (每段可设置不同余量)</span>
                    <button class="btn-add" onclick="addRectangular()">+ 添加方形</button>
                </div>
                <div id="rectangular-list" class="shape-list">
                    <!-- 动态添加方形输入 -->
                </div>
            </div>

            <!-- 冲孔部分 -->
            <div class="section">
                <div class="section-title">
                    <span>🕳️ 冲孔 (每段可设置不同余量)</span>
                    <button class="btn-add" onclick="addHole()">+ 添加冲孔</button>
                </div>
                <div id="hole-list" class="shape-list">
                    <!-- 动态添加冲孔输入 -->
                </div>
            </div>

            <!-- 材料和报价信息 -->
            <div class="section">
                <div class="section-title">⚙️ 材料与报价信息</div>
                
                <div class="form-group">
                    <label for="material">选择材料</label>
                    <select id="material">
                        <option value="7.85">碳钢 (密度: 7.85 g/cm³)</option>
                        <option value="7.93">不锈钢 (密度: 7.93 g/cm³)</option>
                        <option value="2.7">铝合金 (密度: 2.7 g/cm³)</option>
                        <option value="8.96">铜 (密度: 8.96 g/cm³)</option>
                    </select>
                </div>

                <div class="form-group-inline">
                    <div class="form-group">
                        <label for="fire-loss">火耗率 (%)</label>
                        <input type="number" id="fire-loss" step="0.1" value="5" placeholder="例如: 5">
                    </div>
                    <div class="form-group">
                        <label for="unit-price">材料单价 (元/kg)</label>
                        <input type="number" id="unit-price" step="0.01" placeholder="例如: 10">
                    </div>
                    <div class="form-group">
                        <label for="processing-fee">加工费 (元)</label>
                        <input type="number" id="processing-fee" step="0.01" value="0" placeholder="例如: 100">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" onclick="calculate()">🔢 开始计算</button>
            <button class="btn btn-secondary" onclick="resetAll()">🔄 重置所有</button>

            <div id="results" class="results hidden">
                <div class="results-title">📊 计算结果</div>

                <div class="result-section">
                    <div class="result-section-title">📏 精尺寸（加工后）</div>
                    <div class="result-item">
                        <span class="result-label">总体积:</span>
                        <span class="result-value" id="result-finished-volume">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">重量:</span>
                        <span class="result-value" id="result-finished-weight">-</span>
                    </div>
                </div>

                <div class="result-section">
                    <div class="result-section-title">🏗️ 毛坯尺寸（锻造后）</div>
                    <div class="result-item">
                        <span class="result-label">总体积:</span>
                        <span class="result-value" id="result-rough-volume">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">净重:</span>
                        <span class="result-value" id="result-rough-net-weight">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">火耗重量:</span>
                        <span class="result-value" id="result-fire-loss">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">总重 (含火耗):</span>
                        <span class="result-value" id="result-total-weight">-</span>
                    </div>
                </div>

                <div class="result-section">
                    <div class="result-section-title">💰 报价信息</div>
                    <div class="result-item">
                        <span class="result-label">材料费用:</span>
                        <span class="result-value" id="result-material-cost">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">总报价:</span>
                        <span class="result-value" id="result-total-price">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cylinderCount = 0;
        let rectangularCount = 0;
        let holeCount = 0;

        // 添加圆柱形 - 精尺寸和余量在同一行
        function addCylinder() {
            cylinderCount++;
            const cylinderList = document.getElementById('cylinder-list');
            
            const cylinderItem = document.createElement('div');
            cylinderItem.className = 'shape-item';
            cylinderItem.id = `cylinder-${cylinderCount}`;
            cylinderItem.innerHTML = `
                <div class="shape-header">
                    <span class="shape-title">圆柱 ${cylinderCount} (每段余量可不同)</span>
                    <button class="btn-remove" onclick="removeItem('cylinder-${cylinderCount}')">删除</button>
                </div>
                <div class="dimension-row">
                    <div class="dimension-group">
                        <div class="dimension-group-title">直径方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="cylinder-finished-diameter-${cylinderCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="cylinder-allowance-diameter-${cylinderCount}" step="0.1" value="5" placeholder="每面余量 (mm)">
                        </div>
                        <div class="allowance-hint">直径方向总余量 = 2 × 每面余量</div>
                    </div>
                    <div class="dimension-group">
                        <div class="dimension-group-title">高度方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="cylinder-finished-height-${cylinderCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="cylinder-allowance-height-${cylinderCount}" step="0.1" value="5" placeholder="每面余量 (mm)">
                        </div>
                        <div class="allowance-hint">高度方向总余量 = 2 × 每面余量</div>
                    </div>
                </div>
            `;
            
            cylinderList.appendChild(cylinderItem);
        }

        // 添加方形 - 精尺寸和余量在同一行
        function addRectangular() {
            rectangularCount++;
            const rectangularList = document.getElementById('rectangular-list');
            
            const rectangularItem = document.createElement('div');
            rectangularItem.className = 'shape-item';
            rectangularItem.id = `rectangular-${rectangularCount}`;
            rectangularItem.innerHTML = `
                <div class="shape-header">
                    <span class="shape-title">方形 ${rectangularCount} (每段余量可不同)</span>
                    <button class="btn-remove" onclick="removeItem('rectangular-${rectangularCount}')">删除</button>
                </div>
                <div class="dimension-row">
                    <div class="dimension-group">
                        <div class="dimension-group-title">长度方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="rect-finished-length-${rectangularCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="rect-allowance-length-${rectangularCount}" step="0.1" value="5" placeholder="每面余量 (mm)">
                        </div>
                        <div class="allowance-hint">长度方向总余量 = 2 × 每面余量</div>
                    </div>
                    <div class="dimension-group">
                        <div class="dimension-group-title">宽度方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="rect-finished-width-${rectangularCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="rect-allowance-width-${rectangularCount}" step="0.1" value="5" placeholder="每面余量 (mm)">
                        </div>
                        <div class="allowance-hint">宽度方向总余量 = 2 × 每面余量</div>
                    </div>
                    <div class="dimension-group">
                        <div class="dimension-group-title">高度方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="rect-finished-height-${rectangularCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="rect-allowance-height-${rectangularCount}" step="0.1" value="5" placeholder="每面余量 (mm)">
                        </div>
                        <div class="allowance-hint">高度方向总余量 = 2 × 每面余量</div>
                    </div>
                </div>
            `;
            
            rectangularList.appendChild(rectangularItem);
        }

        // 添加冲孔 - 精尺寸和余量在同一行
        function addHole() {
            holeCount++;
            const holeList = document.getElementById('hole-list');
            
            const holeItem = document.createElement('div');
            holeItem.className = 'shape-item';
            holeItem.id = `hole-${holeCount}`;
            holeItem.innerHTML = `
                <div class="shape-header">
                    <span class="shape-title">冲孔 ${holeCount} (每段余量可不同)</span>
                    <button class="btn-remove" onclick="removeItem('hole-${holeCount}')">删除</button>
                </div>
                <div class="dimension-row">
                    <div class="dimension-group">
                        <div class="dimension-group-title">孔径方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="hole-finished-diameter-${holeCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="hole-allowance-diameter-${holeCount}" step="0.1" value="5" placeholder="孔径余量 (mm)">
                        </div>
                        <div class="allowance-hint">冲孔孔径 = 精尺寸 - 2 × 余量</div>
                    </div>
                    <div class="dimension-group">
                        <div class="dimension-group-title">孔深方向</div>
                        <div class="input-pair">
                            <label>精尺寸</label>
                            <input type="number" id="hole-finished-depth-${holeCount}" step="0.1" placeholder="精尺寸 (mm)">
                        </div>
                        <div class="input-pair">
                            <label>余量</label>
                            <input type="number" id="hole-allowance-depth-${holeCount}" step="0.1" value="5" placeholder="孔深余量 (mm)">
                        </div>
                        <div class="allowance-hint">孔深 = 精尺寸 + 余量</div>
                    </div>
                </div>
            `;
            
            holeList.appendChild(holeItem);
        }

        // 删除项目
        function removeItem(id) {
            const item = document.getElementById(id);
            if (item) {
                item.remove();
            }
        }

        // 计算毛坯尺寸
        function calculateRoughDimensions() {
            let totalFinishedVolume = 0;
            let totalRoughVolume = 0;

            // 计算圆柱形
            for (let i = 1; i <= cylinderCount; i++) {
                const finishedDiameter = parseFloat(document.getElementById(`cylinder-finished-diameter-${i}`)?.value);
                const finishedHeight = parseFloat(document.getElementById(`cylinder-finished-height-${i}`)?.value);
                const allowanceDiameter = parseFloat(document.getElementById(`cylinder-allowance-diameter-${i}`)?.value) || 0;
                const allowanceHeight = parseFloat(document.getElementById(`cylinder-allowance-height-${i}`)?.value) || 0;
                
                if (finishedDiameter && finishedHeight) {
                    // 精尺寸体积
                    const finishedRadius = finishedDiameter / 2;
                    const finishedVolume = Math.PI * finishedRadius * finishedRadius * finishedHeight;
                    totalFinishedVolume += finishedVolume;

                    // 毛坯尺寸 = 精尺寸 + 2 × 每面余量
                    const roughDiameter = finishedDiameter + 2 * allowanceDiameter;
                    const roughHeight = finishedHeight + 2 * allowanceHeight;
                    const roughRadius = roughDiameter / 2;
                    const roughVolume = Math.PI * roughRadius * roughRadius * roughHeight;
                    totalRoughVolume += roughVolume;
                }
            }

            // 计算方形
            for (let i = 1; i <= rectangularCount; i++) {
                const finishedLength = parseFloat(document.getElementById(`rect-finished-length-${i}`)?.value);
                const finishedWidth = parseFloat(document.getElementById(`rect-finished-width-${i}`)?.value);
                const finishedHeight = parseFloat(document.getElementById(`rect-finished-height-${i}`)?.value);
                const allowanceLength = parseFloat(document.getElementById(`rect-allowance-length-${i}`)?.value) || 0;
                const allowanceWidth = parseFloat(document.getElementById(`rect-allowance-width-${i}`)?.value) || 0;
                const allowanceHeight = parseFloat(document.getElementById(`rect-allowance-height-${i}`)?.value) || 0;
                
                if (finishedLength && finishedWidth && finishedHeight) {
                    // 精尺寸体积
                    const finishedVolume = finishedLength * finishedWidth * finishedHeight;
                    totalFinishedVolume += finishedVolume;

                    // 毛坯尺寸 = 精尺寸 + 2 × 每面余量
                    const roughLength = finishedLength + 2 * allowanceLength;
                    const roughWidth = finishedWidth + 2 * allowanceWidth;
                    const roughHeight = finishedHeight + 2 * allowanceHeight;
                    const roughVolume = roughLength * roughWidth * roughHeight;
                    totalRoughVolume += roughVolume;
                }
            }

            // 计算冲孔（要减去的体积）
            for (let i = 1; i <= holeCount; i++) {
                const finishedDiameter = parseFloat(document.getElementById(`hole-finished-diameter-${i}`)?.value);
                const finishedDepth = parseFloat(document.getElementById(`hole-finished-depth-${i}`)?.value);
                const allowanceDiameter = parseFloat(document.getElementById(`hole-allowance-diameter-${i}`)?.value) || 0;
                const allowanceDepth = parseFloat(document.getElementById(`hole-allowance-depth-${i}`)?.value) || 0;
                
                if (finishedDiameter && finishedDepth) {
                    // 精尺寸冲孔体积（要减去）
                    const finishedRadius = finishedDiameter / 2;
                    const finishedHoleVolume = Math.PI * finishedRadius * finishedRadius * finishedDepth;
                    totalFinishedVolume -= finishedHoleVolume;

                    // 毛坯冲孔体积（要减去更多的体积，因为毛坯实体更大）
                    // 注意：冲孔的毛坯尺寸是 "精尺寸 - 2×余量"，因为孔要留余量加工
                    const roughDiameter = finishedDiameter - 2 * allowanceDiameter;
                    const roughDepth = finishedDepth + allowanceDepth; // 孔深方向留余量
                    const roughRadius = roughDiameter / 2;
                    const roughHoleVolume = Math.PI * roughRadius * roughRadius * roughDepth;
                    totalRoughVolume -= roughHoleVolume;
                }
            }

            return {
                finishedVolume: totalFinishedVolume,
                roughVolume: totalRoughVolume
            };
        }

        // 主计算函数
        function calculate() {
            const volumes = calculateRoughDimensions();
            
            if (volumes.finishedVolume <= 0 || volumes.roughVolume <= 0) {
                alert('请至少添加一个有效的形状，且体积大于0！');
                return;
            }

            const density = parseFloat(document.getElementById('material').value);
            const fireLossPercent = parseFloat(document.getElementById('fire-loss').value) || 0;
            const unitPrice = parseFloat(document.getElementById('unit-price').value) || 0;
            const processingFee = parseFloat(document.getElementById('processing-fee').value) || 0;

            // 计算重量 (从 mm³ 转换为 kg)
            const finishedWeight = volumes.finishedVolume * density / 1e9; // kg
            const roughNetWeight = volumes.roughVolume * density / 1e9; // kg
            const fireLossWeight = roughNetWeight * (fireLossPercent / 100);
            const totalWeight = roughNetWeight + fireLossWeight;

            // 计算费用
            const materialCost = totalWeight * unitPrice;
            const totalPrice = materialCost + processingFee;

            // 显示结果
            document.getElementById('result-finished-volume').textContent = (volumes.finishedVolume / 1e9).toFixed(2) + ' cm³';
            document.getElementById('result-finished-weight').textContent = finishedWeight.toFixed(2) + ' kg';
            
            document.getElementById('result-rough-volume').textContent = (volumes.roughVolume / 1e9).toFixed(2) + ' cm³';
            document.getElementById('result-rough-net-weight').textContent = roughNetWeight.toFixed(2) + ' kg';
            document.getElementById('result-fire-loss').textContent = fireLossWeight.toFixed(2) + ' kg';
            document.getElementById('result-total-weight').textContent = totalWeight.toFixed(2) + ' kg';
            
            document.getElementById('result-material-cost').textContent = '¥' + materialCost.toFixed(2);
            document.getElementById('result-total-price').textContent = '¥' + totalPrice.toFixed(2);
            
            document.getElementById('results').classList.remove('hidden');
            
            // 滚动到结果区域
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        // 重置所有
        function resetAll() {
            if (confirm('确定要重置所有输入吗？这将删除所有添加的形状和冲孔。')) {
                // 清空所有列表
                document.getElementById('cylinder-list').innerHTML = '';
                document.getElementById('rectangular-list').innerHTML = '';
                document.getElementById('hole-list').innerHTML = '';
                
                // 重置计数器
                cylinderCount = 0;
                rectangularCount = 0;
                holeCount = 0;
                
                // 重置输入
                document.getElementById('fire-loss').value = 5;
                document.getElementById('unit-price').value = '';
                document.getElementById('processing-fee').value = 0;
                
                // 隐藏结果
                document.getElementById('results').classList.add('hidden');
            }
        }

        // 页面加载时添加默认的圆柱和方形
        document.addEventListener('DOMContentLoaded', function() {
            addCylinder();
            addRectangular();
        });
    </script>
</body>
</html>
